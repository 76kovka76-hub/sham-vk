name: SKRBL — бесплатный пилот коротких комиксов
on:
  push:
    branches: [main]
    paths:
      - 'skrbl/story_bank.py'
      - 'skrbl/story_composer.py'
      - 'skrbl/pilot_queue.py'
      - 'skrbl/tests/**'
      - '.github/workflows/skrbl-pilot.yml'
  schedule:
    # GitHub cron is best effort; a check never publishes unreviewed copies.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = only code; enqueue = one original free comic'
        type: choice
        default: preview
        required: true
        options:
          - preview
          - enqueue

permissions:
  contents: write

concurrency:
  group: skrbl-original-pilot
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only free Python dependencies
        run: python -m pip install requests pillow
      - name: Validate all SKRBL storyboards and panel layouts offline
        run: python -m unittest discover -s skrbl/tests -p 'test_*.py' -v
      - name: Preview or schedule one free original 1–4 panel meme
        env:
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'enqueue') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[START_SKRBL_PILOT]') && 'enqueue') || 'preview' }}
        run: |
          if [ "$MODE" = "enqueue" ]; then
            python -u skrbl/pilot_queue.py --enqueue
          else
            python -u skrbl/pilot_queue.py --preview
          fi
      - name: Save produced SKRBL image for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skrbl-original-pilot-${{ github.run_id }}
          path: |
            skrbl/story_preview.png
            skrbl/story_preview.json
          if-no-files-found: ignore
          retention-days: 10
      - name: Persist queue state after successfully scheduling
        if: always()
        run: |
          if git diff --quiet -- skrbl/queue_state.json; then
            echo "No new SKRBL post added."
            exit 0
          fi
          git config user.name "skrbl-pilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skrbl/queue_state.json
          git commit -m "bot(SKRBL): save original free scheduled comic"
          if git push; then exit 0; fi
          for i in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::SKRBL queue history conflicted; avoid posting a duplicate."
              exit 1
            fi
            if git push; then exit 0; fi
            sleep $((2*i))
          done
          echo "::error::Unable to save SKRBL schedule ledger; inspect VediSMM."
          exit 1
