name: SOVETSKIY — проверка подключения ВК
on:
  push:
    branches: [main]
    paths:
      - 'sovetskiy/check_account.py'
      - '.github/workflows/sovetskiy-account.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Read-only VediSMM account check (SOVETSKIY only)
        env:
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
        run: python -u sovetskiy/check_account.py
