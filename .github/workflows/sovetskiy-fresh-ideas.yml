name: SOVETSKIY — генерация новых шуток без оплаты
on:
  push:
    branches: [main]
    paths:
      - 'sovetskiy/fresh_ideas.py'
      - '.github/workflows/sovetskiy-fresh-ideas.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-original-humor:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test a free LLM and separate quality critic, without VK post
        run: python -u sovetskiy/fresh_ideas.py
