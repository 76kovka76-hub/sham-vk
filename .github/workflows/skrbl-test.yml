name: SKRBL — безопасная проверка нового сообщества
on:
  push:
    branches: [main]
    paths:
      - 'skrbl/**'
      - '.github/workflows/skrbl-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-skrbl-target:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install requests
      - name: Strict SKRBL group check
        env:
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
        run: python skrbl/check_account.py
