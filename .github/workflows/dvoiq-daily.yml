name: DVOIQ — до 10 Telegram/Threads в сутки
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dvoiq-daily.yml"
      - "dvoiq/daily.py"
      - "dvoiq/bank.json"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview: make six images without publishing; schedule: queue today"
        required: true
        type: choice
        default: preview
        options: [preview, schedule]

permissions:
  contents: write

concurrency:
  group: dvoiq-daily-editorial
  cancel-in-progress: false

jobs:
  dvoiq:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator requirements
        run: python -m pip install "Pillow>=10,<13" "requests>=2.31,<3"
      - name: Check images or schedule up to ten DVOIQ posts
        env:
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EDITOR_MODE: ${{ github.event.inputs.mode }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EDITOR_MODE" = "schedule" ]; then
            python -u dvoiq/daily.py
          else
            python -u dvoiq/daily.py --preview
            printf '{"status":"preview_only","note":"Nothing sent to VediSMM"}\n' > dvoiq_daily_result.json
          fi
      - name: Record last workflow outcome (no secrets)
        if: always()
        shell: bash
        run: |
          if [ ! -f dvoiq_daily_result.json ]; then
            printf '{"status":"failed_or_incomplete","note":"See GitHub Actions logs; no success inferred"}\n' > dvoiq_daily_result.json
          fi
          cp dvoiq_daily_result.json dvoiq/last_schedule.json
          git config user.name "dvoiq-bot"
          git config user.email "dvoiq-bot@users.noreply.github.com"
          git add dvoiq/last_schedule.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(dvoiq): record latest scheduling outcome"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep "$attempt"
          done
          exit 1
      - name: Save preview images and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvoiq-edition-${{ github.run_id }}
          path: |
            dvoiq_previews/*.png
            dvoiq_output/*.png
            dvoiq_daily_result.json
          if-no-files-found: ignore
          retention-days: 7
