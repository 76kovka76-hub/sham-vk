name: SHAM — пост каждые 15 минут
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'README.md'
      - 'vedismm_publisher.py'
      - 'meme_bank.py'
      - 'hashtags.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sham.yml'
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview — только картинка; publish — отправка в ВК (если не стоит SHAM_PAUSED=true)'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - publish

permissions:
  contents: write

concurrency:
  group: sham-publisher
  cancel-in-progress: false

jobs:
  meme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Generate meme or publish to VK
        env:
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && 'publish') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[START_SHAM]') && 'publish') || 'preview' }}
          PUBLISH_ENABLED: 'true'
          SHAM_PAUSED: ${{ vars.SHAM_PAUSED }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          SHAM_BACKEND: ${{ vars.SHAM_BACKEND || 'vk' }}
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
          VEDISMM_ACCOUNT_ID: ${{ vars.VEDISMM_ACCOUNT_ID }}
        run: |
          if [ "$MODE" = "preview" ]; then
            python main.py --preview
          else
            python main.py --publish
          fi
      - name: Save preview image and text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sham-preview-${{ github.run_id }}
          path: |
            output/sham_meme.png
            output/preview.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remember published posts (avoid repeats)
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish')
        run: |
          if git diff --quiet -- state/history.json; then
            echo "No new VK post to record"
            exit 0
          fi
          git config user.name "sham-bot"
          git config user.email "sham-bot@users.noreply.github.com"
          git add state/history.json
          git commit -m "bot: remember published VK meme"
          git push
