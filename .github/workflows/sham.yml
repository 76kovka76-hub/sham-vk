name: SHAM — очередь мемов 12 часов вперёд
on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'README.md'
      - 'vedismm_publisher.py'
      - 'horde_style.py'
      - 'queue_planner.py'
      - 'queue_health.py'
      - 'meme_bank.py'
      - 'hashtags.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/sham.yml'
  schedule:
    # Пополнение очереди каждые 5 минут, когда запас ниже 12 часов.
    - cron: '*/5 * * * *'
    # Read-only status reconciliation of delayed posts once per hour.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview — предпросмотр; enqueue — в отложенную очередь; health — проверка; publish — немедленно'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - enqueue
          - health
          - publish
      visual_style:
        description: 'Для preview: auto (по расписанию), anime или realistic'
        required: false
        default: auto
        type: choice
        options:
          - auto
          - anime
          - realistic

permissions:
  contents: write

concurrency:
  group: sham-publisher
  cancel-in-progress: false

jobs:
  meme:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Generate meme or publish to VK
        env:
          MODE: ${{ github.event.inputs.mode || (github.event_name == 'schedule' && github.event.schedule == '7 * * * *' && 'health') || (github.event_name == 'schedule' && 'enqueue') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[START_QUEUE]') && 'enqueue') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[CHECK_QUEUE]') && 'health') || 'preview' }}
          PUBLISH_ENABLED: 'true'
          SHAM_PAUSED: ${{ vars.SHAM_PAUSED }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          SHAM_BACKEND: ${{ secrets.VEDISMM_TOKEN != '' && 'vedismm' || vars.SHAM_BACKEND || 'vk' }}
          SHAM_VISUAL_STYLE: 'horde'
          SHAM_PREVIEW_STYLE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[TEST_REALISTIC]') && 'realistic') || github.event.inputs.visual_style || 'auto' }}
          AIHORDE_API_KEY: ${{ secrets.AIHORDE_API_KEY }}
          VEDISMM_TOKEN: ${{ secrets.VEDISMM_TOKEN }}
          VEDISMM_ACCOUNT_ID: ${{ vars.VEDISMM_ACCOUNT_ID }}
        run: |
          if [ "$MODE" = "preview" ]; then
            python main.py --preview
          elif [ "$MODE" = "enqueue" ]; then
            python main.py --enqueue
          elif [ "$MODE" = "health" ]; then
            python main.py --health
          else
            python main.py --publish
          fi
      - name: Save preview image and text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sham-preview-${{ github.run_id }}
          path: |
            output/sham_meme.png
            output/preview.json
            output/image_source.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remember published posts (avoid repeats)
        if: success() && (github.event_name == 'schedule' || github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'enqueue' || github.event.inputs.mode == 'health' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[START_QUEUE]')))
        run: |
          if git diff --quiet -- state/history.json; then
            echo "No new VK post to record"
            exit 0
          fi
          git config user.name "sham-bot"
          git config user.email "sham-bot@users.noreply.github.com"
          git add state/history.json
          git commit -m "bot: remember SHAM queue and verified VK posts"
          if git push; then
            exit 0
          fi
          # Another commit may have advanced main while the generator worked.
          # Rebase safely. Never force push or silently discard state/history.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::SHAM history conflict. Scheduled post may exist on VediSMM; do not blindly republish."
              git rebase --abort || true
              exit 1
            fi
            if git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not safely save queue history to GitHub."
          exit 1
